name: Build Trimr APK

on:
  push:
    branches: [ "claude/android-video-trimmer-x83rbu" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build debug APK
        working-directory: VideoTrimmer
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp VideoTrimmer/app/build/outputs/apk/debug/app-debug.apk trimr-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimr-debug-apk
          path: trimr-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release delete trimr-latest --yes --cleanup-tag || true
          gh release create trimr-latest trimr-debug.apk \
            --title "Trimr — latest debug APK" \
            --notes "Sideloadable debug build of the Trimr video trimmer. Built from ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
